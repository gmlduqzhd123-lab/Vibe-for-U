name: Browser tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: browser-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    # 파일 이름 대소문자 충돌, ESLint, Prettier 서식, 타입 검사
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
  e2e:
    runs-on: ubuntu-24.04
    # 브라우저 설치가 멈추면 몇 시간씩 남지 않게 작업 전체에 제한 시간을 둔다(보통 7분 안팎).
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # msedge는 학교 PC에서 많이 쓰는 실제 Edge(러너에 설치된 정식판),
        # Chromium은 크롬·웨일과 같은 엔진, WebKit은 아이폰·아이패드 Safari와 같은 엔진이다.
        browser: [msedge, chromium, webkit]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # 성능 예산: 첫 화면 파일 크기가 정한 한도를 넘으면 실패한다.
      - run: npm run budget
      # 내려받은 브라우저는 Playwright 버전(package-lock)이 같을 때 다시 쓴다.
      - if: matrix.browser != 'msedge'
        id: browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}
      - if: matrix.browser != 'msedge' && steps.browsers.outputs.cache-hit != 'true'
        timeout-minutes: 12
        run: npx playwright install --with-deps ${{ matrix.browser }}
      # 브라우저를 캐시에서 꺼냈으면 시스템 라이브러리만 설치한다.
      - if: matrix.browser != 'msedge' && steps.browsers.outputs.cache-hit == 'true'
        timeout-minutes: 12
        run: npx playwright install-deps ${{ matrix.browser }}
      # Edge는 러너 이미지에 이미 있으므로 버전만 기록하고, 없을 때만 설치한다.
      - if: matrix.browser == 'msedge'
        run: |
          if [ -x /opt/microsoft/msedge/msedge ]; then
            /opt/microsoft/msedge/msedge --version
          else
            npx playwright install --with-deps msedge
          fi
      - run: npx playwright test
        env:
          PW_BROWSER: ${{ matrix.browser }}
      # 화면 모습 검사가 찍은 휴대전화·태블릿·PC 사진(한국어·영어)을 사람이 훑어볼 수 있게 남긴다.
      - if: always() && matrix.browser == 'chromium'
        uses: actions/upload-artifact@v6
        with:
          name: layout-screenshots
          path: test-results/layout-*/*.png
          retention-days: 14
      - if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            playwright-report
            test-results
          retention-days: 7
