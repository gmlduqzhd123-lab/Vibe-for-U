name: Build and deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      asset: ${{ steps.asset.outputs.asset }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      # 배포 뒤 공개 주소가 이번 빌드로 바뀌었는지 확인할 때 쓴다.
      - id: asset
        run: echo "asset=$(grep -o 'assets/index-[A-Za-z0-9_-]*\.js' dist/index.html | head -1)" >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
  public-check:
    # 실제 공개 주소에서 같은 브라우저 흐름을 검사한다.
    needs: [build, deploy]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Wait for the new build to be served
        env:
          URL: ${{ needs.deploy.outputs.page_url }}
          ASSET: ${{ needs.build.outputs.asset }}
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "$URL" | grep -q "$ASSET"; then exit 0; fi
            sleep 10
          done
          echo "공개 주소가 5분 안에 $ASSET 을(를) 제공하지 않았어요." >&2
          exit 1
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test -c playwright.public.config.ts
        env:
          PW_BROWSER: chromium
          PUBLIC_URL: ${{ needs.deploy.outputs.page_url }}
      - if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-public
          path: |
            playwright-report/public
            test-results/public
          retention-days: 7
