<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>1안 역할 선택형 · 뚝딱 바이브 공작소 홈 시안</title>
    <link rel="icon" href="../favicon.svg" />
    <link rel="stylesheet" href="concepts.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">본문으로 건너뛰기</a>
    <header class="site-header">
      <a
        class="brand"
        href="../#/home"
        target="_top"
        aria-label="뚝딱 바이브 공작소 현재 앱 홈"
        ><img src="../favicon.svg" width="40" height="40" alt="" /><span
          >뚝딱 바이브 공작소</span
        ></a
      >
      <nav aria-label="보조 메뉴">
        <details class="menu">
          <summary>전체 메뉴 <span aria-hidden="true">☰</span></summary>
          <div class="menu-panel">
            <a href="../#/try" target="_top">3분 첫 체험</a
            ><a href="../#/missions" target="_top">전체 만들기 미션</a
            ><a href="../#/library" target="_top">내 작품 이어하기</a
            ><a href="../#/teacher" target="_top">교사 자료와 활동지</a
            ><a href="../#/share" target="_top">QR 소개 카드</a>
          </div>
        </details>
      </nav>
    </header>
    <main id="main" tabindex="-1" class="concept-a">
      <div class="intro">
        <span class="eyebrow">작은 앱으로 배우는 코딩의 원리</span>
        <h1>누가 사용하나요</h1>
        <p>퀴즈·이야기·타이머를 만들고 고치며 배워요</p>
      </div>
      <div class="role-cards">
        <a data-primary class="role-card student" href="../#/try" target="_top"
          ><div class="role-icon">
            <svg
              viewBox="0 0 24 24"
              width="28"
              height="28"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              aria-hidden="true"
            >
              <path d="m8 4 12 8-12 8z" />
            </svg>
          </div>
          <div class="role-copy">
            <span class="card-overline">직접 해 보고 싶어요</span>
            <h2>학생으로 시작</h2>
            <p>3분 체험에서 작은 퀴즈를 고쳐봐요</p>
          </div>
          <span class="card-action"
            >체험 시작
            <svg
              viewBox="0 0 24 24"
              width="22"
              height="22"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              aria-hidden="true"
            >
              <path d="M4 12h15m-6-6 6 6-6 6" /></svg></span></a
        ><a
          data-primary
          class="role-card teacher"
          href="../#/prepare"
          target="_top"
          ><div class="role-icon">
            <svg
              viewBox="0 0 24 24"
              width="28"
              height="28"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              aria-hidden="true"
            >
              <path
                d="M12 5v16M12 5C8 2 3 4 3 4v15s5-2 9 2c4-4 9-2 9-2V4s-5-2-9 1Z"
              />
            </svg>
          </div>
          <div class="role-copy">
            <span class="card-overline">수업에 활용하고 싶어요</span>
            <h2>교사로 시작</h2>
            <p>40분 수업과 활동지를 준비해요</p>
          </div>
          <span class="card-action"
            >수업 준비
            <svg
              viewBox="0 0 24 24"
              width="22"
              height="22"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              aria-hidden="true"
            >
              <path d="M4 12h15m-6-6 6 6-6 6" /></svg></span
        ></a>
      </div>
      <div class="returning">
        <span>전에 만든 작품이 있나요?</span
        ><a href="../#/library" target="_top"
          >이어서 만들기
          <svg
            viewBox="0 0 24 24"
            width="22"
            height="22"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            aria-hidden="true"
          >
            <path d="M4 12h15m-6-6 6 6-6 6" /></svg
        ></a>
      </div>
    </main>
    <footer class="site-footer">
      <span>가입 없이 시작해요</span><span aria-hidden="true">·</span
      ><span>학습 기록은 내 기기에 남아요</span>
    </footer>
    <script src="menu.js"></script>
  </body>
</html>
