<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />

      >
      <nav aria-label="보조 메뉴">
        <a class="teacher-shortcut" href="../#/prepare" target="_top"
          >선생님 수업 준비
          <svg
            viewBox="0 0 24 24"
            width="22"
            height="22"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            aria-hidden="true"
          >
            <path d="M4 12h15m-6-6 6 6-6 6" /></svg
        ></a>
        <details class="menu">
          <summary>전체 메뉴 <span aria-hidden="true">☰</span></summary>

      </nav>

    <main id="main" tabindex="-1" class="concept-b">
      <section class="single-hero">
        <div class="single-copy">
          <span class="eyebrow">처음이라면 여기서 시작해요</span>
          <h1>작은 퀴즈 하나만<br />같이 고쳐볼까요</h1>
          <p>
            같은 정답을 세 번 눌러 보고<br />점수 규칙 하나를 바꾸는 3분

          </p>
          <a data-primary class="primary-action" href="../#/try" target="_top"
            >3분 체험 시작
            <svg
              viewBox="0 0 24 24"
              width="22"
              height="22"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              aria-hidden="true"
            >
              <path d="M4 12h15m-6-6 6 6-6 6" /></svg
          ></a>
          <div class="micro-steps" aria-label="체험 순서">
            <span>먼저 예상</span><i aria-hidden="true">→</i
            ><span>눌러보기</span><i aria-hidden="true">→</i

          </div>
        </div>
        <div class="single-art" aria-hidden="true">

            <img src="mascot.svg" width="300" height="240" alt="" />

          <svg

            width="22"
            height="22"
            fill="none"

            aria-hidden="true"

            <path d="M4 12h15m-6-6 6 6-6 6" /></svg
